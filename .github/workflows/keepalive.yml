name: GitHub Action Keepalive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        env:
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 45
